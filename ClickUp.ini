[Rainmeter]
Update=1000
AccurateText=1
MouseScrollUpAction=[!WriteKeyValue Variables SkinW 560][!WriteKeyValue Variables SkinH 420][!Refresh]
MouseScrollDownAction=[!WriteKeyValue Variables SkinW 460][!WriteKeyValue Variables SkinH 330][!Refresh]

[Variables]
SkinW=420
SkinH=310

; Configure estes valores antes de atualizar o skin.
APIToken=COLOQUE_SEU_TOKEN_DA_API_AQUI
TeamID=COLOQUE_SEU_TEAM_ID_AQUI
ClickUpAppUrl=clickup://COLOQUE_SEU_TEAM_ID_AQUI/v/l/COLOQUE_SEU_LINK_AQUI

ColorBg=24,25,29,252
ColorBorder=44,45,51,255
ColorTextMuted=130,133,145,255
ColorTextMain=225,226,233,255
ColorPurple=123,104,238,255
ColorGreen=32,185,120,255

; -------------------------------------------------------------
; Atualizacao Periodica (20 segundos)
; -------------------------------------------------------------
[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % 20) + 1
IfEqualValue=1
IfEqualAction=[!CommandMeasure MeasureGetDone "Run"][!CommandMeasure MeasureGetTodo "Run"]

; 1. Obtem apenas tarefas concluidas
[MeasureGetDone]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$headers = @{ Authorization = '#APIToken#' }; try { $res = Invoke-RestMethod -Uri 'https://api.clickup.com/api/v2/team/#TeamID#/task?include_closed=true&subtasks=true' -Headers $headers -TimeoutSec 10; $fmt = { param($t) $d = if ($t.due_date) { [DateTimeOffset]::FromUnixTimeMilliseconds([int64]$t.due_date).ToLocalTime().ToString('dd/MM') } else { '-' }; $p = if ($t.priority.priority) { $t.priority.priority.ToUpper() } else { '-' }; $n = if ($t.name.Length -gt 24) { $t.name.Substring(0, 21) + '...' } else { $t.name }; '{0,-26} {1,-7} {2,-6}' -f $n, $d, $p }; $done = @($res.tasks | Where-Object { $_.status.type -in @('closed','done') -or $_.status.status -like '*conclu*' -or $_.status.status -eq 'complete' }); if ($done.Count -gt 0) { ($done | Select-Object -First 3 | ForEach-Object { & $fmt $_ }) -join [Environment]::NewLine } else { 'Sem tarefas concluidas' } } catch { 'Erro ao carregar' }"
OutputType=UTF8
UpdateDivider=-1
FinishAction=[!UpdateMeter MeterDoneTasks][!Redraw]

; 2. Obtem apenas tarefas pendentes
[MeasureGetTodo]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$headers = @{ Authorization = '#APIToken#' }; try { $res = Invoke-RestMethod -Uri 'https://api.clickup.com/api/v2/team/#TeamID#/task?include_closed=true&subtasks=true' -Headers $headers -TimeoutSec 10; $fmt = { param($t) $d = if ($t.due_date) { [DateTimeOffset]::FromUnixTimeMilliseconds([int64]$t.due_date).ToLocalTime().ToString('dd/MM') } else { '-' }; $p = if ($t.priority.priority) { $t.priority.priority.ToUpper() } else { '-' }; $n = if ($t.name.Length -gt 24) { $t.name.Substring(0, 21) + '...' } else { $t.name }; '{0,-26} {1,-7} {2,-6}' -f $n, $d, $p }; $todo = @($res.tasks | Where-Object { $_.status.type -notin @('closed','done') -and $_.status.status -notlike '*conclu*' -and $_.status.status -ne 'complete' }); if ($todo.Count -gt 0) { ($todo | Select-Object -First 6 | ForEach-Object { & $fmt $_ }) -join [Environment]::NewLine } else { 'Sem tarefas pendentes' } } catch { 'Erro ao carregar' }"
OutputType=UTF8
UpdateDivider=-1
FinishAction=[!UpdateMeter MeterTodoTasks][!Redraw]
; -------------------------------------------------------------
; Interface Grafica
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,
DynamicVariables=1


[MeterBtnSizeS]
Meter=String
Text="P"
X=(#SkinW# - 75)
Y=12
FontSize=8
FontWeight=700
FontColor=#ColorTextMuted#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
ToolTipText="Tamanho Pequeno"
LeftMouseUpAction=[!WriteKeyValue Variables SkinW 420][!WriteKeyValue Variables SkinH 310][!Refresh]

[MeterBtnSizeM]
Meter=String
Text="M"
X=(#SkinW# - 55)
Y=12
FontSize=8
FontWeight=700
FontColor=#ColorTextMuted#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
ToolTipText="Tamanho Medio"
LeftMouseUpAction=[!WriteKeyValue Variables SkinW 480][!WriteKeyValue Variables SkinH 350][!Refresh]

[MeterBtnSizeL]
Meter=String
Text="G"
X=(#SkinW# - 35)
Y=12
FontSize=8
FontWeight=700
FontColor=#ColorTextMuted#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
ToolTipText="Tamanho Grande"
LeftMouseUpAction=[!WriteKeyValue Variables SkinW 560][!WriteKeyValue Variables SkinH 430][!Refresh]

[MeterRefreshBtn]
Meter=String
Text="[R]"
X=(#SkinW# - 18)
Y=12
FontSize=8
FontColor=#ColorTextMuted#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
ToolTipText="Atualizar tarefas"
LeftMouseUpAction=[!CommandMeasure MeasureGetDone "Run"][!CommandMeasure MeasureGetTodo "Run"]

; --- SECCAO 1: CONCLUIDO ---
[MeterDoneBadge]
Meter=Shape
Shape=Rectangle 22,14,92,18,9 | Fill Color #ColorGreen# | StrokeWidth 0

[MeterDoneText]
Meter=String
Text="CONCLUIDO"
X=32
Y=16
FontSize=7.5
FontWeight=700
FontColor=255,255,255,255
AntiAlias=1

[MeterDoneTasks]
Meter=String
MeasureName=MeasureGetDone
FontFace=Consolas
FontSize=8.5
FontColor=165,168,180,255
X=25
Y=40
W=(#SkinW# - 45)
H=45
ClipString=1
InlineSetting=LineSpacing | 4
Text="%1"
AntiAlias=1
DynamicVariables=1

; Linha Divisoria
[MeterMidDivider]
Meter=Shape
Shape=Line 20,95,(#SkinW# - 20),95 | Stroke Color #ColorBorder# | StrokeWidth 1
DynamicVariables=1

; --- SECCAO 2: PENDENTE ---
[MeterPendingDot]
Meter=Shape
Shape=Ellipse 28,114,4 | Fill Color 0,0,0,0 | Stroke Color #ColorTextMuted# | StrokeWidth 1.5

[MeterPendingText]
Meter=String
Text="PENDENTE"
X=38
Y=107
FontSize=8
FontWeight=700
FontColor=#ColorTextMuted#
AntiAlias=1

; Cabecalho das Colunas
[MeterColHeader]
Meter=String
FontFace=Consolas
FontSize=8.5
FontWeight=700
FontColor=#ColorTextMuted#
X=25
Y=130
Text="Nome                      Data    Prio"
AntiAlias=1

[MeterHeaderLine]
Meter=Shape
Shape=Line 20,147,(#SkinW# - 20),147 | Stroke Color #ColorBorder# | StrokeWidth 1
DynamicVariables=1

; Lista de Tarefas Pendentes
[MeterTodoTasks]
Meter=String
MeasureName=MeasureGetTodo
FontFace=Consolas
FontSize=8.5
FontColor=#ColorTextMain#
X=25
Y=155
W=(#SkinW# - 45)
H=(#SkinH# - 205)
ClipString=1
InlineSetting=LineSpacing | 6
InlinePattern=(HIGH|URGENT|ALTA|URGENTE)
InlineSetting2=Color | 255,100,100,255
InlinePattern3=(NORMAL|LOW|BAIXA)
InlineSetting3=Color | 100,180,255,255
Text="%1"
AntiAlias=1
DynamicVariables=1

; --- Rodape: Abertura no ClickUp Desktop ---
[MeterFooterDivider]
Meter=Shape
Shape=Line 20,(#SkinH# - 42),(#SkinW# - 20),(#SkinH# - 42) | Stroke Color #ColorBorder# | StrokeWidth 1
DynamicVariables=1

[MeterBtnAdd]
Meter=String
Text="+ Adicionar Tarefa"
X=25
Y=(#SkinH# - 30)
FontSize=9
FontWeight=600
FontColor=#ColorPurple#
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
ToolTipText="Abrir no aplicativo ClickUp"
LeftMouseUpAction=["#ClickUpAppUrl#"]
